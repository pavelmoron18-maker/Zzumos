<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zzumos · Desayunos personalizados</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/zzumos.css">
</head>
<body>
<header id="nav"></header>
<main class="wrap">
  <section class="hero">
    <div><h1>¡Desayunos personalizados!</h1><p>Pide desde casa y recíbelo fresco cada mañana.</p></div>
    <a class="btn" href="#menu">Ver menú ↓</a>
  </section>
  <div style="margin-top:18px"><input id="buscar" placeholder="Buscar desayuno…"></div>
  <section class="grid" id="menu"><p>Cargando…</p></section>
</main>
<script src="js/app.js"></script>
<script>
let productos = [];
function pintar(txt = '') {
  const lista = productos.filter(p => p.nombre.toLowerCase().includes(txt.toLowerCase()));
  document.getElementById('menu').innerHTML = lista.length ? lista.map(p => `
    <article class="card">
      <div class="ph">🍳</div>
      <h3>${esc(p.nombre)}</h3><p>${esc(p.descripcion)}</p>
      <div class="pie"><span class="precio">${money(p.precioBase)}</span>
      <a class="btn" href="personalizar.html?id=${p.id}">Personalizar</a></div>
    </article>`).join('') : '<p>No hay desayunos que coincidan.</p>';
}
(async () => {
  await renderNav('inicio');
  try { productos = await API.get('/api/productos'); pintar(); }
  catch (e) { document.getElementById('menu').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  document.getElementById('buscar').oninput = e => pintar(e.target.value);
})();
</script>
</body>
</html>
