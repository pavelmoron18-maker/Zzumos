spring.application.name=zzumos
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/zzumos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=admin

# El esquema lo maneja el script db/zzumos_db.sql, no Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Sesión y seguridad ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Contraseña inicial de las cuentas de prueba (admin@zzumos.com y personal@zzumos.com).
# CÁMBIALA antes de desplegar: se puede definir con la variable de entorno ADMIN_PASSWORD.
zzumos.admin.password=${ADMIN_PASSWORD:Admin1234!}
